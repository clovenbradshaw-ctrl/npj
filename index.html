<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>People's Journalism</title>

<link rel="icon" type="image/png" href="https://storage.googleapis.com/intelechia-content/NPJ/1.png" />
<link rel="apple-touch-icon" href="https://storage.googleapis.com/intelechia-content/NPJ/1.png" />
<link rel="stylesheet" href="app/styles.css" />
<!-- all fonts via link (keeps CSS captureable / offline-friendly) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Spline+Sans+Mono:wght@400;500;600&family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />
<!-- Phosphor icons (webfont): the whole UI's icon set. window.I in app/ui/shared.jsx
     renders <i class="ph ph-NAME">, sized by font-size, colored by currentColor. -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

<!-- Image galleries. Splide (in-article carousel) + GLightbox (fullscreen,
     zoomable photo viewer — how a wide image is read at full size). Vendored
     under vendor/ like eoreader4 (offline-friendly, no third-party CDN at
     runtime) and DEFERRED, since only the post-paint reader uses them. They
     publish window.Splide / window.GLightbox, which app/ui/shared.jsx guards on. -->
<link rel="stylesheet" href="vendor/splide/splide.min.css" />
<link rel="stylesheet" href="vendor/glightbox/glightbox.min.css" />
<script defer src="vendor/splide/splide.min.js"></script>
<script defer src="vendor/glightbox/glightbox.min.js"></script>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(127,216,166,.6); } 70% { box-shadow: 0 0 0 7px rgba(127,216,166,0); } 100% { box-shadow: 0 0 0 0 rgba(127,216,166,0); } }
  html, body { background: var(--paper); }
  #root { min-height: 100vh; }

  /* Boot splash: painted from static HTML the instant the page parses, so the
     screen carries the brand while React, Babel, the ~30 in-browser .jsx files
     and boot()'s committed-layout fetch all resolve. React clears #root on its
     first render, which removes this automatically — no teardown needed. The
     short fade-in delay means a warm-cache load that mounts in <200ms never
     flashes the spinner; only a real wait shows it. */
  @keyframes boot-fade { to { opacity: 1; } }
  #boot-splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; padding: 24px; background: var(--paper);
    opacity: 0; animation: boot-fade .45s ease .18s forwards;
  }
  #boot-splash .boot-band {
    background: var(--yellow); padding: 16px 34px; border-radius: 4px;
    box-shadow: 0 1px 0 var(--rule-strong, rgba(22,20,13,.4));
  }
  #boot-splash .boot-band img { width: min(440px, 72vw); height: auto; display: block; }
  #boot-splash .boot-spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid var(--rule, rgba(22,20,13,.16));
    border-top-color: var(--ink, #16140d);
    animation: spin .8s linear infinite;
  }
  #boot-splash .boot-note {
    font-family: var(--mono, ui-monospace, monospace);
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-soft, #3a362b);
  }
</style>

<!-- React production builds: ~140 KB total vs. the ~1 MB dev builds, and no
     dev-only checks on every render. Babel is NOT loaded here anymore — app/boot.js
     pulls it in lazily and only on a cache miss (a first visit or a changed file),
     so a warm cache never downloads the ~3 MB transformer at all. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

<script src="app/core/data.js"></script>
<!-- live sources: pulls archive.org items tagged "npj-source" into DATASETS/SOURCES -->
<script src="app/sources/archive-sources.js"></script>
<!-- best-effort source identity: guess a web source's title + outlet from its URL
     slug/host, and read the real ones off the page's own <title>/og: tags. No model. -->
<script src="app/sources/source-title.js"></script>
<!-- media CDN: resolves archive.org links to direct image URLs for <image-slot>,
     and (pageMeta) reads a source's identity off the CORS-open archived HTML -->
<script src="app/sources/archive-cdn.js"></script>
<!-- expose hooks globally so every babel file uses them bare without colliding -->
<script>
  window.useState = React.useState;
  window.useEffect = React.useEffect;
  window.useRef = React.useRef;
  window.useCallback = React.useCallback;
  window.useMemo = React.useMemo;
</script>

<!-- plain scripts: matrix auth, durable drafts -->
<script src="app/identity/matrix-auth.js"></script>
<!-- passkey vault: lock your sign-in behind Face ID / a fingerprint (WebAuthn PRF) -->
<script src="app/identity/passkey-vault.js"></script>
<!-- contributor profiles (the byline): name + About me, local + Matrix account, pulled from account info -->
<script src="app/identity/profiles.js"></script>
<!-- media store: uploads image-slot drops to the Matrix homeserver while drafting, frozen to archive.org at publish -->
<script src="app/media/media-store.js"></script>
<!-- source view: makes an uploaded source viewable + citable (kind detection,
     durable display URLs via the media store, lazy pdf.js text extraction) -->
<script src="app/sources/source-view.js"></script>
<script src="app/identity/drafts.js"></script>
<!-- editing-only post structure: the append-only log + fold + flatten + built-in
     post types (window.NpjStructure). Never published — stripped at build (I1). -->
<script src="app/record/structure.js"></script>
<script src="app/media/image-slot.js"></script>
<!-- photo editor: crop + HARD redaction baked into the pixels before the image is
     re-uploaded, so only the redacted copy can ever reach archive.org (window.NpjPhotoEditor) -->
<script src="app/media/photo-editor.js"></script>
<!-- the six kinds of void (asserted absence), one taxonomy shared by the editor,
     the publish fold and the reader's lens (window.NpjVoidKinds) -->
<script src="app/core/void-kinds.js"></script>
<!-- url → embeddable player (YouTube/Vimeo/Google Drive/Docs/archive.org/media);
     shared by the composer, the edit surface and the reader. Load before
     articles.js, whose blocksToHtml rebuilds embeds through it. -->
<script src="app/media/embed.js"></script>
<!-- the published record: per-document folders of timestamped version files
     (articles/<slug>/) — list, fold, publish, commit edits as new versions -->
<script src="app/record/articles.js"></script>
<!-- span-anchored reader feedback (suggest/comment) committed as EVA events in
     the article's own folder; merge applies + commits a REC. Requires NpjArticles. -->
<script src="app/feedback/feedback.js"></script>
<!-- Substack export: a folded article → clean .md + rich HTML for the clipboard
     (paste into Substack keeps headings, images, links & the sourcing). -->
<script src="app/export/substack-export.js"></script>
<!-- Outstanding fact checks: each ungrounded claim (⊥ needs source, ¬ conflict)
     paired with the TYPE of evidence that would ground it — the negative space.
     evidence-needs.js reads it mechanically (optionally sharpened by a local
     LLM); fact-check-export.js shapes the plain, paste-anywhere list. -->
<script src="app/grounding/evidence-needs.js"></script>
<script src="app/export/fact-check-export.js"></script>
<!-- grounding model: reusable citation records (spans of a source) + sentence
     segmentation for the table view. Plain scripts; require window.NPJ. -->
<script src="app/sources/citations.js"></script>
<script src="app/record/sentences.js"></script>
<!-- composition provenance: how a draft was assembled (typed vs. pasted, paste
     sizes, revision, timeline). Counts + timestamps only — never the words. -->
<script src="app/record/composition.js"></script>
<!-- source provenance: synthetic dedup (one signature per content, linked across
     projects) + backtracking (source → every article that cites it). No model. -->
<script src="app/sources/sources.js"></script>
<!-- definitions: the per-article glossary + the COLLECTIVE published-definition
     index across the record (window.NpjDefinitions). Terms are extracted by
     eoreader4 (the bridge below) and counted relative to the article's length;
     a term may carry conflicting definitions drawn from past articles. -->
<script src="app/grounding/definitions.js"></script>
<!-- pii-v2 pack: mechanical recognizers (regex + checksum + context) for
     data-shaped PII — phones, SSNs, cards, addresses, emails (no name-guessing) —
     that surface candidate spans + hard-redact them before a source hits
     archive.org. No model — each finding carries a `basis`. -->
<script src="app/redaction/pii.js"></script>
<!-- Citey — the grounding assistant. State is mechanical (reads the editor's own
     grounding); voice is leashed (templated, no model). Plain scripts, order matters. -->
<script src="app/grounding/citey-assist.js"></script>
<script src="app/grounding/citey-states.js"></script>
<script src="app/grounding/CiteyBrain.js"></script>
<script src="app/grounding/CiteyVoice.js"></script>
<!-- proposition graph: eoreader4's model-free reading core, vendored + bridged
     (window.EOReader4), the prose→doc adapter (window.NpjPropGraph) and the SVG
     node-link renderer (window.NpjGraphRender). The bridge is an ES module that
     publishes window.EOReader4 after load — consumers guard on its presence. -->
<script src="app/graph/prop-graph.js"></script>
<script src="app/graph/graph-render.js"></script>
<script type="module" src="app/graph/eoreader4-bridge.js"></script>
<!-- layout publish client (ES module → window.NpjLayout) -->
<script type="module" src="backend/npj-layout.client.js"></script>

<!-- The app's ~30 .jsx files are compiled + run by app/boot.js (loaded at the
     end of <body>), NOT by Babel's <script type="text/babel"> auto-runner.
     boot.js compiles ONLY the front-page core (layout + shared UI + FrontPage +
     the app shell) before first paint, then fills in the article reader and the
     whole editor AFTER paint — and caches every file's compiled output in the
     browser (keyed by source hash), so a returning visitor skips both the Babel
     download and all transpilation. The router shows a light spinner if you
     reach a route whose code is still streaming in. The inline #npj-app shell
     below is the last unit boot.js runs; that's what mounts React. -->
</head>
<body>
<div id="root">
  <!-- Static initialization state — replaced by <App /> on first React render. -->
  <div id="boot-splash" role="status" aria-label="Loading People's Journalism">
    <div class="boot-band"><img src="assets/npj-logo-wide.png" alt="People's Journalism" /></div>
    <div class="boot-spinner" aria-hidden="true"></div>
    <div class="boot-note">Loading the newsroom…</div>
  </div>
</div>
<noscript><div style="padding:48px 24px;font-family:Georgia,serif;max-width:42rem;margin:0 auto;color:#16140d">People's Journalism needs JavaScript enabled to read and edit stories.</div></noscript>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#16140d"/>
    <rect x="18" y="30" width="64" height="40" rx="6" fill="#ffec01"/>
    <rect x="26" y="40" width="48" height="5" fill="#16140d"/>
    <rect x="26" y="50" width="48" height="5" fill="#16140d"/>
    <rect x="26" y="60" width="30" height="5" fill="#16140d"/>
  </svg>
</template>

<!-- The app shell. type="text/npj" so the browser doesn't run it and Babel's
     auto-runner (if ever present) ignores it — app/boot.js reads this element's
     text, compiles it last, and runs it to mount React. The EDITMODE tweak block
     stays here so the host's in-place tweak rewriter keeps finding it. -->
<script type="text/npj" id="npj-app">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#ffec01",
  "palette": [
    "#f6f1e4",
    "#efe9d8",
    "#16140d"
  ],
  "headline": "Anton",
  "body": "Newsreader",
  "auditDefault": false,
  "trustDefault": "all"
}/*EDITMODE-END*/;

// The reader and the editor are compiled AFTER first paint (see app/boot.js),
// so a route can be reached before its code exists. This hook re-renders when a
// bundle finishes (window.__npjReady.{read,all}); the router gates each route on
// the matching flag and shows BootLoading until then. The front page is in the
// eager core, so it never waits.
function useNpjReady() {
  const [, bump] = useState(0);
  useEffect(() => {
    const on = () => bump(n => n + 1);
    window.addEventListener("npj:modules-ready", on);
    return () => window.removeEventListener("npj:modules-ready", on);
  }, []);
  const R = window.__npjReady || {};
  return { read: !!R.read, all: !!R.all };
}

function BootLoading({ label }) {
  return (
    <div style={{ minHeight: "62vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18, padding: 24 }}>
      <div style={{ width: 24, height: 24, borderRadius: "50%", border: "3px solid var(--rule, rgba(22,20,13,.16))", borderTopColor: "var(--ink, #16140d)", animation: "spin .8s linear infinite" }} aria-hidden="true" />
      <div className="np-mono" style={{ fontSize: 12, letterSpacing: ".1em", textTransform: "uppercase", color: "var(--ink-soft, #3a362b)" }}>{label || "Loading…"}</div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // ---- layout config + Matrix-backed permissions ----
  // boot() below resolves the committed layout BEFORE the first render, so the
  // site paints with the admin's published settings — never default-then-swap.
  const [layout, setLayoutState] = useState(() => window.__bootLayout || window.loadLayout());
  const setLayout = useCallback((next) => {
    setLayoutState(prev => {
      const n = window.normalizeLayout(typeof next === "function" ? next(prev) : next);
      window.saveLayoutLocal(n); return n;
    });
  }, []);
  const [session, setSession] = useState(() => window.MatrixAuth.restore());
  // a #welcome=<token> link drops a brand-new contributor into the onboarding
  // wizard (sign in → name → password) before the rest of the app exists for them
  const welcomePayload = useRef((() => {
    const m = (location.hash || "").match(/(?:^#|[;&])welcome=([^;&]+)/);
    return m ? window.MatrixAuth.parseInviteToken(m[1]) : null;
  })()).current;
  const [welcomeDone, setWelcomeDone] = useState(false);
  const [isGuest, setIsGuest] = useState(false);
  const me = (session && session.user_id) || "@you:guest";
  const role = window.roleOf(layout, session && session.user_id);
  const isAdmin = role === "admin";
  const isEditorRole = role === "admin" || role === "editor";
  // Fold the committed contributor profiles (name + About me) into the people
  // registry every render, so the byline, the Handle and the masthead always
  // read the current published names/bios (idempotent — a plain merge into
  // window.NPJ.PEOPLE, the same registry signIn already writes).
  if (window.applyContributorsToPeople) window.applyContributorsToPeople(layout);
  // openArticle is a stable useCallback; read admin status through a ref so the
  // unpublished-article gate always sees the live role without re-creating the
  // callback (which the boot/deep-link effect depends on).
  const isAdminRef = useRef(isAdmin);
  isAdminRef.current = isAdmin;

  // refresh from the committed layout (GitHub) — skipped when boot() already
  // seeded it this session, so the chrome never visibly swaps after first paint
  useEffect(() => {
    if (window.__bootLayout) return;
    let alive = true;
    (async () => {
      try { const committed = await window.NpjLayout.loadCommittedLayout(); if (alive && committed) setLayout(committed); } catch (e) {}
    })();
    return () => { alive = false; };
  }, [setLayout]);

  // when signed in, reconcile roles from the Matrix control room (authoritative)
  useEffect(() => {
    if (!session) return; let alive = true;
    (async () => {
      try {
        const roles = await window.MatrixAuth.readPermissions();
        if (alive && roles) setLayout(prev => ({ ...prev, roles: { ...prev.roles, ...window.normalizeRoles(roles) } }));
      } catch (e) {}
    })();
    return () => { alive = false; };
  }, [session, setLayout]);

  // Guest access. A signed-in account with no allowlist role still reaches the
  // newsroom if it's a member of at least one project room — that's how an
  // invite-link guest "has access" without the admin editing the allowlist.
  // joinedRooms() self-heals a pending invite into a real join, so a guest who
  // just followed a link resolves to a member here. It's membership-scoped: a
  // guest only ever sees the room(s) they were invited to, and (no role →) still
  // can't publish or manage anyone.
  useEffect(() => {
    if (!session || isEditorRole) { setIsGuest(false); return; }
    let alive = true;
    (async () => {
      try {
        const rooms = await window.MatrixAuth.joinedRooms();
        if (alive) setIsGuest((rooms || []).some(r => r.kind !== "control"));
      } catch (e) { if (alive) setIsGuest(false); }
    })();
    return () => { alive = false; };
  }, [session, isEditorRole]);

  // hydrate MY durable profile from my Matrix account on sign-in, so my own
  // byline reads right even before the layout is (re)published. Best-effort; it
  // folds into window.NPJ.PEOPLE and the next render picks it up.
  useEffect(() => {
    if (!session || !window.NpjProfiles) return;
    window.NpjProfiles.hydrateMine(session, window.loadLayout()).catch(() => {});
  }, [session]);

  const hp = (location.hash.slice(1) || "").split(/[;,&]/).map(s => s.trim());
  const [route, setRoute] = useState(["newsroom", "article", "standards", "submit", "explore", "docs", "contributors"].find(r => hp.includes(r)) || "home");
  // ---- the published record (versioned EO event logs under articles/) ----
  // frontRev repaints the front page once the committed line-up loads;
  // articleRev remounts the reader when an article is opened or edited.
  const [frontRev, setFrontRev] = useState(0);
  const [articleRev, setArticleRev] = useState(0);
  // #article;read=<slug> deep link — resolved on mount, and it must hold the
  // "no article → go home" guard open while the log is being fetched
  const pendingRead = useRef((() => {
    const part = hp.find(p => /^read=/.test(p));
    return part ? decodeURIComponent(part.slice(5)) : null;
  })());
  // which doc is open survives a refresh (hash) and a new visit (localStorage) —
  // otherwise the newsroom silently reopens the default "working" draft and a
  // freshly created doc looks like it vanished
  const [draftId, setDraftId] = useState(() => {
    const part = hp.find(p => /^doc=/.test(p));
    if (part) return decodeURIComponent(part.slice(4));
    try { return localStorage.getItem("npj_last_doc") || "working"; } catch (e) { return "working"; }
  });
  const [audit, setAudit] = useState(hp.includes("audit"));
  const [showSugg, setShowSugg] = useState(hp.includes("sugg"));
  const [filter, setFilter] = useState("all");

  // figures rail is disabled until the extraction engine is ready
  const [entityData] = useState(null);
  const [entityOpen, setEntityOpen] = useState(false);
  const [activeEntity, setActiveEntity] = useState(null);

  // span feedback (window.NpjFeedback): suggestions + comments persisted as EVA
  // events in the article's own folder, with a localStorage mirror. Loaded when
  // an article opens. Proposing/voting/replying is open to anyone; MERGING
  // commits a real REC through the authorized edit path (admin + assignees).
  const [suggestions, setSuggestions] = useState([]);
  const fbToken = () => (window.MatrixAuth && window.MatrixAuth.token && window.MatrixAuth.token()) || null;
  const reloadFeedback = useCallback(() => {
    const A = window.NPJ.ARTICLE; if (!A || !A.slug) { setSuggestions([]); return Promise.resolve(); }
    return window.NpjFeedback.load(A.slug, { base_sha: A.base_sha }).then(setSuggestions).catch(() => {});
  }, []);
  useEffect(() => {
    if (route !== "article" || !window.NPJ.ARTICLE) { setSuggestions([]); return; }
    reloadFeedback();
  }, [route, articleRev, reloadFeedback]);

  const onVote = (id) => {
    const A = window.NPJ.ARTICLE; if (!A) return;
    setSuggestions(list => list.map(s => s.id === id ? { ...s, voted: !s.voted, votes: s.votes + (s.voted ? -1 : 1) } : s));
    window.NpjFeedback.vote({ slug: A.slug, ref: id, author: me, token: fbToken() });
  };
  const onResolve = (id, outcome) => {
    const A = window.NPJ.ARTICLE; if (!A) return;
    window.NpjFeedback.resolve({ slug: A.slug, ref: id, outcome, author: me, token: fbToken() }).then(reloadFeedback);
  };
  const onReply = (id, text) => {
    const A = window.NPJ.ARTICLE; if (!A) return;
    window.NpjFeedback.reply({ slug: A.slug, ref: id, text, author: me, token: fbToken() }).then(reloadFeedback);
  };
  const onAddSuggestion = (draft) => {
    const A = window.NPJ.ARTICLE; if (!A) return;
    window.NpjFeedback.propose({ slug: A.slug, anchor: draft.anchor, kind: draft.kind, proposed: draft.proposed, rationale: draft.rationale, author: me, base_sha: A.base_sha, token: fbToken() }).then(reloadFeedback);
  };
  // Merge a suggestion: apply its words to the body + commit a REC, then fold the
  // updated article in place (same path as the Edit overlay). Returns the merge
  // result so the card can surface a clean "conflict" (the base moved) state.
  const onMerge = async (s) => {
    const A = window.NPJ.ARTICLE; if (!A) return { ok: false };
    const r = await window.NpjFeedback.merge({ slug: A.slug, article: A, suggestion: s, actor: me, token: fbToken() });
    if (r.ok) {
      const ts = new Date().toISOString();
      const updated = { ...A, body: r.body, updated: ts.slice(0, 10), base_sha: r.sha,
        readMins: window.NpjArticles.readMins(r.body),
        versions: [{ sha: r.sha, ts, author: me, message: r.note || "Merged a suggestion", headline: A.headline || "", dek: A.dek || "", text: window.NpjArticles.plainText(r.body) }, ...(A.versions || [])] };
      window.NPJ.ARTICLE = updated; setArticleRev(rv => rv + 1);
      window.NpjArticles.loadFront().then(() => setFrontRev(rv => rv + 1)).catch(() => {});
    }
    return r;
  };

  // apply system tweaks to :root
  useEffect(() => {
    const r = document.documentElement.style;
    r.setProperty("--yellow", t.accent);
    r.setProperty("--yellow-deep", `color-mix(in srgb, ${t.accent} 78%, #000)`);
    r.setProperty("--paper", t.palette[0]);
    r.setProperty("--paper-2", t.palette[1]);
    r.setProperty("--ink", t.palette[2]);
    r.setProperty("--card", `color-mix(in srgb, ${t.palette[0]} 45%, #fff)`);
    r.setProperty("--display", `'${t.headline}', 'Arial Narrow', sans-serif`);
    r.setProperty("--serif", `'${t.body}', Georgia, serif`);
  }, [t.accent, t.palette, t.headline, t.body]);

  // admin brand overrides (from the published layout) win over tweak defaults
  useEffect(() => {
    const r = document.documentElement.style; const b = layout.brand || {};
    if (b.accent) { r.setProperty("--yellow", b.accent); r.setProperty("--yellow-deep", `color-mix(in srgb, ${b.accent} 78%, #000)`); }
    if (b.headline) r.setProperty("--display", `'${b.headline}', 'Arial Narrow', sans-serif`);
    if (b.body) r.setProperty("--serif", `'${b.body}', Georgia, serif`);
  }, [layout.brand, t.accent, t.headline, t.body]);

  useEffect(() => { setAudit(!!t.auditDefault); }, [t.auditDefault]);
  useEffect(() => { setFilter(t.trustDefault); }, [t.trustDefault]);

  // Open a published article: fetch its EO log, fold it, install it, route.
  // Accepts a slug (front page, docs, deep link) or an already-folded article
  // object (the Newsroom hands one over right after publishing, so the reader
  // never races the raw CDN for the file it just committed).
  const openArticle = useCallback(async (slugOrArticle) => {
    if (slugOrArticle && typeof slugOrArticle === "object" && slugOrArticle.body) {
      window.NPJ.ARTICLE = slugOrArticle;
      setArticleRev(r => r + 1); setRoute("article"); window.scrollTo(0, 0);
      return;
    }
    if (!slugOrArticle) { if (window.NPJ.ARTICLE) { setRoute("article"); window.scrollTo(0, 0); } return; }
    try {
      const a = await window.NpjArticles.loadArticle(String(slugOrArticle));
      // unpublished pieces don't load for anyone but an admin — hidden from the
      // site even on a direct link, though the log is still public on GitHub
      if (a && a.status === "unpublished" && !isAdminRef.current) return;
      if (a) { window.NPJ.ARTICLE = a; setArticleRev(r => r + 1); setRoute("article"); window.scrollTo(0, 0); }
    } catch (e) { /* unreadable log → stay where we are */ }
  }, []);

  // boot: pull the committed line-up onto the front page, and resolve a deep link
  useEffect(() => {
    let alive = true;
    (async () => {
      try { await window.NpjArticles.loadFront(); if (alive) setFrontRev(r => r + 1); } catch (e) {}
    })();
    (async () => {
      const slug = pendingRead.current;
      if (!slug) return;
      try { await openArticle(slug); } finally {
        pendingRead.current = null;
        if (alive && !window.NPJ.ARTICLE) setRoute(r => (r === "article" ? "home" : r));
      }
    })();
    return () => { alive = false; };
  }, [openArticle]);

  // no article? never sit on the article route (unless a deep link is still loading)
  useEffect(() => { if (route === "article" && !window.NPJ.ARTICLE && !pendingRead.current) setRoute("home"); }, [route]);

  // keep the URL hash in sync so a refresh restores the view — including which
  // article is open (#article;read=<slug> is also the canonical share link)
  useEffect(() => {
    if (route === "home") { history.replaceState(null, "", location.pathname + location.search); return; }
    const f = [route];
    if (route === "article") {
      if (window.NPJ.ARTICLE && window.NPJ.ARTICLE.slug) f.push("read=" + encodeURIComponent(window.NPJ.ARTICLE.slug));
      if (audit) f.push("audit");
      if (showSugg) f.push("sugg");
      if (entityOpen) f.push("figures");
    }
    if (route === "newsroom" && draftId && draftId !== "working") f.push("doc=" + encodeURIComponent(draftId));
    history.replaceState(null, "", "#" + f.join(";"));
  }, [route, audit, showSugg, entityOpen, draftId, articleRev]);

  const goHome = () => { setRoute("home"); window.scrollTo(0, 0); };
  // "Newsroom" lands on the document explorer (your docs + projects); the
  // editor itself opens from there via openDoc. #newsroom deep-links still
  // reach the editor directly.
  const goNewsroom = () => { setRoute("docs"); window.scrollTo(0, 0); };
  const goStandards = () => { setRoute("standards"); window.scrollTo(0, 0); };
  const goSubmit = () => { setRoute("submit"); window.scrollTo(0, 0); };
  const goExplore = () => { setRoute("explore"); window.scrollTo(0, 0); };
  const goContributors = () => { setRoute("contributors"); window.scrollTo(0, 0); };
  const goDocs = () => { setRoute("docs"); window.scrollTo(0, 0); };
  const openDoc = (id) => {
    const did = id || "working";
    setDraftId(did);
    try { localStorage.setItem("npj_last_doc", did); } catch (e) {}
    setRoute("newsroom"); window.scrollTo(0, 0);
  };

  const signIn = (sess) => {
    setSession(sess);
    if (sess && sess.user_id && !window.NPJ.PEOPLE[sess.user_id]) {
      const col = (window.NpjProfiles && window.NpjProfiles.colorFor) ? window.NpjProfiles.colorFor(sess.user_id) : "#b23a26";
      window.NPJ.PEOPLE[sess.user_id] = { name: sess.user_id.replace(/^@/, "").split(":")[0], role: sess.admin ? "Admin" : "Contributor", trust: "editor", color: col };
    }
    // land in the workspace — Documents — not on a free-floating writing
    // surface (the old flow dropped you into an orphan post composer)
    setRoute("docs"); window.scrollTo(0, 0);
  };
  // Sign out flushes every pending draft to the account FIRST — the Matrix
  // /logout kills the token, so any sync still in its debounce window would
  // otherwise die with it. Capped so a dead homeserver can't block signing out.
  const signOut = async () => {
    try { if (window.NpjDrafts) await Promise.race([window.NpjDrafts.flushAll(), new Promise(r => setTimeout(r, 4000))]); } catch (e) {}
    try { await window.MatrixAuth.logout(); } catch (e) {}
    setSession(null);
  };

  window.__nav = { standards: goStandards, submit: goSubmit, explore: goExplore, contributors: goContributors, docs: goDocs,
    account: () => (session ? signOut() : goSubmit()), user: session && session.user_id, role, isAdmin, isEditor: isEditorRole };

  // gate routes whose code is still streaming in after first paint (the front
  // page is always ready); WelcomeInvite + every page ride the "read" bundle.
  const ready = useNpjReady();

  // a valid invite link owns the whole screen until the newcomer finishes; then
  // we drop the #welcome token and sign them into the workspace like anyone else
  if (welcomePayload && !welcomeDone) {
    if (!ready.read) return <BootLoading />;
    return <WelcomeInvite payload={welcomePayload} onDone={(sess) => {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      setWelcomeDone(true);
      if (sess) signIn(sess);
    }} />;
  }

  return (
    <window.LayoutCtx.Provider value={{ layout, setLayout, isAdmin, isEditor: isEditorRole, role, me, admin: window.SEED_ADMIN }}>
      {route === "home" && <FrontPage key={"front-" + frontRev} onOpen={openArticle} onNewsroom={goNewsroom} onHome={goHome} />}
      {route === "article" && (ready.read ? (window.NPJ.ARTICLE && (
        <ArticleRead key={(window.NPJ.ARTICLE.slug || "a") + ":" + articleRev}
          audit={audit} setAudit={setAudit}
          showSugg={showSugg} setShowSugg={setShowSugg}
          suggestions={suggestions} onVote={onVote} onResolve={onResolve} onReply={onReply} onMerge={onMerge} onAddSuggestion={onAddSuggestion}
          filter={filter} setFilter={setFilter}
          entityData={entityData} entityOpen={entityOpen} setEntityOpen={setEntityOpen}
          activeEntity={activeEntity} setActiveEntity={setActiveEntity}
          me={me} onHome={goHome} onNewsroom={goNewsroom}
          onEdited={(a) => {
            window.NPJ.ARTICLE = a; setArticleRev(r => r + 1);
            // reflect the edit (incl. an unpublish/republish) on the front page
            // right away, even if the git-tree listing hasn't caught up yet
            const reflect = () => { window.NpjArticles.patchFrontStatus(a.slug, a.status); setFrontRev(r => r + 1); };
            window.NpjArticles.loadFront().then(reflect).catch(reflect);
          }} />
      )) : <BootLoading />)}
      {route === "newsroom" && (ready.all
        ? ((isEditorRole || isGuest)
          ? <Newsroom key={draftId} session={session} draftId={draftId} onExit={goHome} onDocs={goDocs} onPublished={openArticle} />
          : <NewsroomLocked signedIn={!!session} me={me} onSignIn={goSubmit} onHome={goHome} />)
        : <BootLoading label="Loading the newsroom…" />)}
      {route === "standards" && (ready.read ? <StandardsPage onHome={goHome} onNewsroom={goNewsroom} onSubmit={goSubmit} /> : <BootLoading />)}
      {route === "contributors" && (ready.read ? <ContributorsPage onHome={goHome} onNewsroom={goNewsroom} /> : <BootLoading />)}
      {route === "submit" && (ready.read ? <SubmitPage session={session} onSignIn={signIn} onSignOut={signOut} onHome={goHome} onNewsroom={goNewsroom} onDocs={goDocs} /> : <BootLoading />)}
      {route === "explore" && (ready.read ? <DataExplorer onHome={goHome} onNewsroom={goNewsroom} onOpenArticle={openArticle} /> : <BootLoading />)}
      {route === "docs" && (ready.read ? <DocumentsPage session={session} onOpen={openDoc} onOpenArticle={openArticle} onHome={goHome} onNewsroom={goNewsroom} onSignIn={goSubmit} /> : <BootLoading />)}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand" />
        <TweakColor label="Accent" value={t.accent}
          options={["#ffec01", "#ff5a3c", "#23c186", "#3aa0ff"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakColor label="Paper / ink" value={t.palette}
          options={[["#f6f1e4", "#efe9d8", "#16140d"], ["#f1efe9", "#e7e4da", "#14140f"], ["#faf8f1", "#efece2", "#111111"], ["#16140d", "#211e15", "#f3eedd"]]}
          onChange={(v) => setTweak("palette", v)} />
        <TweakSection label="Type" />
        <TweakSelect label="Headline" value={t.headline}
          options={["Anton", "Oswald", "Barlow Condensed"]}
          onChange={(v) => setTweak("headline", v)} />
        <TweakSelect label="Body" value={t.body}
          options={["Newsreader", "Lora", "Spectral"]}
          onChange={(v) => setTweak("body", v)} />
        <TweakSection label="Reading defaults" />
        <TweakToggle label="Open in Audit Mode" value={t.auditDefault}
          onChange={(v) => setTweak("auditDefault", v)} />
        <TweakRadio label="Default trust view" value={t.trustDefault}
          options={["all", "preferred", "editor"]}
          onChange={(v) => setTweak("trustDefault", v)} />
      </TweaksPanel>

      <AdminEditor />
    </window.LayoutCtx.Provider>
  );
}

// Boot: paint with the admin's committed settings, never default-then-swap.
// A returning visitor renders instantly from the local cache (last committed
// layout); a first visit blocks briefly on site/layout.json (3.5s cap) so the
// very first paint already carries the published chrome + brand.
(async function boot() {
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("npj_layout_v1") || "null"); } catch (e) {}
  if (!cached && window.NpjLayout) {
    try {
      const committed = await Promise.race([
        window.NpjLayout.loadCommittedLayout(),
        new Promise(res => setTimeout(() => res(null), 3500))
      ]);
      if (committed) {
        window.__bootLayout = window.normalizeLayout(committed);
        window.saveLayoutLocal(window.__bootLayout);
      }
    } catch (e) {}
  }
  // fold committed contributor profiles into the people registry before the
  // first paint, so bylines/mastheads render with real names from the start
  const bootLayout = window.__bootLayout || window.normalizeLayout(cached);
  if (window.applyContributorsToPeople) window.applyContributorsToPeople(bootLayout);
  // brand vars before the first frame — effects re-apply these identically
  const b = (bootLayout.brand) || {};
  const r = document.documentElement.style;
  if (b.accent) { r.setProperty("--yellow", b.accent); r.setProperty("--yellow-deep", `color-mix(in srgb, ${b.accent} 78%, #000)`); }
  if (b.headline) r.setProperty("--display", `'${b.headline}', 'Arial Narrow', sans-serif`);
  if (b.body) r.setProperty("--serif", `'${b.body}', Georgia, serif`);
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>

<!-- The module loader: compiles the front-page core, mounts the shell above,
     then streams in the reader + editor after paint — caching compiled output
     to the browser so repeat visits skip Babel entirely. Runs last so the
     #npj-app element and the plain app/*.js globals it needs already exist. -->
<script src="app/boot.js"></script>
</body>
</html>
